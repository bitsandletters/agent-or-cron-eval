name: Offline harness verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/install.py
      - run: .venv/bin/cronbench verify
      - run: python -m compileall -q src tests
      - run: python fixtures/generate.py --check
      - run: python -m unittest discover -s tests -v
      - run: .venv/bin/cronbench plan --config configs/offline.json --out runs/ci
      - run: .venv/bin/cronbench run --study runs/ci
      - run: .venv/bin/cronbench aggregate --study runs/ci
